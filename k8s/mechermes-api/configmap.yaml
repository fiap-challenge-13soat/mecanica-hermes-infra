apiVersion: v1
kind: ConfigMap
metadata:
  name: mecanica-hermes-api-config
  namespace: mecanica-hermes
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Logging__LogLevel__Default: "Information"
  Jwt__Issuer: "MecanicaHermes"
  EmailSenderOptions__Enabled: "true"
  EmailSenderOptions__SmtpServer: "localhost"
  EmailSenderOptions__SmtpPort: "1025"
  EmailSenderOptions__SslRequired: "false"
  EmailSenderOptions__UserName: "postmaster@fiap.com"
  EmailSenderOptions__SenderInformation__Name: "Mecânica Hermes"
  EmailSenderOptions__SenderInformation__Address: "postmaster@fiap.com"
