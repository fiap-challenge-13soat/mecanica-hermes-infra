name: Database - Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Target service"
        required: true
        default: "api-cadastros"
        type: choice
        options:
          - api-cadastros
          - api-ordem-servico
          - api-pagamentos
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prd

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    environment: aws
    env:
      ENVIRONMENT: ${{ inputs.environment || vars.environment }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Terraform Init
        working-directory: ./services/${{ inputs.service }}
        run: terraform init "-backend-config=backend-${{ env.ENVIRONMENT }}.hcl"

      - name: Terraform Plan
        working-directory: ./services/${{ inputs.service }}
        run: terraform plan -destroy -input=false -var="environment=${{ env.ENVIRONMENT }}"

      - name: Terraform Destroy
        working-directory: ./services/${{ inputs.service }}
        run: terraform apply -destroy -auto-approve -input=false -var="environment=${{ env.ENVIRONMENT }}"
