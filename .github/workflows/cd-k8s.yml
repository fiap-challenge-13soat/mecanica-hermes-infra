name: Deploy no Cluster Kubernetes EKS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configurar acesso ao cluster EKS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Aplicar configurações do Kubernetes
        run: |
          aws eks update-kubeconfig --region us-east-1 --name mecanica-hermes-tf-cluster

      - name: Deploy da aplicação
        env:
          DB_ENDPOINT: ${{ secrets.AWS_RDS_DB_ENDPOINT }}
          DB_USERNAME: ${{ secrets.AWS_RDS_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.AWS_RDS_DB_PASSWORD }}
          JWT_KEY: ${{ secrets.MECHERMES_JWT_KEY }}
          EMAIL_PASSWORD: ${{ secrets.MAILPIT_PASSWORD }}
        run: |
          kubectl apply -f kubectl/namespace.yaml
          kubectl create secret generic app-secret -n mecanica-hermes \
            --from-literal=ConnectionStrings__DefaultConnection="Host=${{ secrets.AWS_RDS_DB_ENDPOINT }};Database=mecanicahermestfdb;Username=postgres;Password=${{ secrets.AWS_RDS_DB_PASSWORD }};Pooling=true" \
            --from-literal=Jwt__Key="$JWT_KEY" \
            --from-literal=EmailSenderOptions__Password="$EMAIL_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -          
          kubectl apply -f kubectl/app

          kubectl create secret generic app-secret -n mecanica-hermes --from-literal=ConnectionStrings__DefaultConnection="Host=
