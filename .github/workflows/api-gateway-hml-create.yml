name: API Gateway HML - Terraform Create

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform Apply - API Gateway HML"
    runs-on: ubuntu-latest
    environment: aws

    defaults:
      run:
        working-directory: ./api-gateway
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Discover Infrastructure Values
        id: discover
        run: |
          echo "Discovering VPC ID..."
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=mechermes-vpc" \
            --query "Vpcs[0].VpcId" \
            --output text)
          echo "VPC_ID=$VPC_ID" >> $GITHUB_OUTPUT
          echo "✓ VPC ID: $VPC_ID"

          echo "Discovering Private Subnets..."
          PRIVATE_SUBNETS=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=mechermes-vpc-private-*" \
            --query "Subnets[*].SubnetId" \
            --output json | jq -r 'join(",")')
          echo "PRIVATE_SUBNETS=$PRIVATE_SUBNETS" >> $GITHUB_OUTPUT
          echo "✓ Private Subnets: $PRIVATE_SUBNETS"

          echo "Discovering API Backend Security Group..."
          API_BACKEND_SG=$(aws ec2 describe-security-groups \
            --filters "Name=tag:Name,Values=mechermes-sg" \
            --query "SecurityGroups[0].GroupId" \
            --output text)
          echo "API_BACKEND_SG=$API_BACKEND_SG" >> $GITHUB_OUTPUT
          echo "✓ API Backend SG: $API_BACKEND_SG"

          echo "Discovering Cognito User Pool ARN..."
          COGNITO_ARN=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='mechermes-hml-userpool'].Arn | [0]" \
            --output text)
          echo "COGNITO_ARN=$COGNITO_ARN" >> $GITHUB_OUTPUT
          echo "✓ Cognito ARN: $COGNITO_ARN"

          echo "Discovering Lambda Function ARN..."
          LAMBDA_ARN=$(aws lambda get-function \
            --function-name mechermes-hml-cognito-token-lambda \
            --query "Configuration.FunctionArn" \
            --output text)
          echo "LAMBDA_ARN=$LAMBDA_ARN" >> $GITHUB_OUTPUT
          echo "✓ Lambda ARN: $LAMBDA_ARN"

      - name: Terraform Init
        run: terraform init -backend-config=backend-hml.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="project_name=mechermes" \
            -var="environment=hml" \
            -var="cognito_user_pool_arn=${{ steps.discover.outputs.COGNITO_ARN }}" \
            -var="lambda_function_arn=${{ steps.discover.outputs.LAMBDA_ARN }}" \
            -var="lambda_function_name=mechermes-hml-cognito-token-lambda" \
            -var="vpc_id=${{ steps.discover.outputs.VPC_ID }}" \
            -var='private_subnets=[${{ steps.discover.outputs.PRIVATE_SUBNETS }}]' \
            -var="api_backend_sg_id=${{ steps.discover.outputs.API_BACKEND_SG }}" \
            -var="nlb_target_port=80" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        id: output
        run: |
          API_GATEWAY_URL=$(terraform output -raw stage_invoke_url)
          echo "API_GATEWAY_URL=$API_GATEWAY_URL" >> $GITHUB_OUTPUT
          echo "✓ API Gateway URL: $API_GATEWAY_URL"

      - name: Summary
        run: |
          echo "## API Gateway HML - Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ API Gateway deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoint URL" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.output.outputs.API_GATEWAY_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Routes" >> $GITHUB_STEP_SUMMARY
          echo "- \`POST /auth/generate-token\` - Generate Cognito token (no auth)" >> $GITHUB_STEP_SUMMARY
          echo "- \`ANY /{proxy+}\` - API Backend (JWT required)" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /health\` - Health check (no auth)" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /healthz/live\` - Liveness probe (no auth)" >> $GITHUB_STEP_SUMMARY
          echo "- \`GET /healthz/ready\` - Readiness probe (no auth)" >> $GITHUB_STEP_SUMMARY
