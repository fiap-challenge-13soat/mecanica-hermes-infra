name: API Gateway - Terraform Create

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prd

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform Apply - API Gateway"
    runs-on: ubuntu-latest
    environment: aws

    defaults:
      run:
        working-directory: ./shared/api-gateway
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: aws eks update-kubeconfig --name mechermes-eks

      - name: Discover Infrastructure Values
        id: discover
        run: |
          ENV="${{ inputs.environment }}"

          echo "Discovering VPC ID..."
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=mechermes-vpc" \
            --query "Vpcs[0].VpcId" \
            --output text)
          echo "✓ VPC ID: $VPC_ID"

          echo "Discovering Private Subnets..."
          PRIVATE_SUBNETS_JSON=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=mechermes-vpc-private-*" \
            --query "Subnets[*].SubnetId" \
            --output json)
          echo "✓ Private Subnets: $PRIVATE_SUBNETS_JSON"

          echo "Discovering Cognito User Pool ARN..."
          COGNITO_POOL_ID=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='mechermes-${ENV}-userpool'].Id | [0]" \
            --output text)
          COGNITO_ARN=$(aws cognito-idp describe-user-pool \
            --user-pool-id "$COGNITO_POOL_ID" \
            --query "UserPool.Arn" \
            --output text)
          echo "✓ Cognito ARN: $COGNITO_ARN"

          echo "Discovering Cognito App Client ID..."
          COGNITO_CLIENT_ID=$(aws cognito-idp list-user-pool-clients \
            --user-pool-id "$COGNITO_POOL_ID" \
            --query "UserPoolClients[0].ClientId" \
            --output text)
          echo "✓ Cognito Client ID: $COGNITO_CLIENT_ID"

          echo "Discovering Lambda Function ARN..."
          LAMBDA_ARN=$(aws lambda get-function \
            --function-name mechermes-${ENV}-cognito-token-lambda \
            --query "Configuration.FunctionArn" \
            --output text)
          echo "✓ Lambda ARN: $LAMBDA_ARN"

          # ── NLB discovery via K8s service hostname ────────────────────────
          # Resolves the NLB listener ARN for a service by reading the hostname
          # from the Service's .status.loadBalancer.ingress — this works
          # regardless of which cloud controller (in-tree or AWS LBC) provisioned
          # the NLB, and regardless of tag format conventions.
          # All debug output goes to stderr so only the ARN reaches the caller.

          get_nlb_listener() {
            local namespace="$1"
            local service="$2"
            local desc="$3"

            echo "Getting NLB hostname for ${namespace}/${service}..." >&2
            local hostname
            hostname=$(kubectl get service "$service" -n "$namespace" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)

            if [ -z "$hostname" ] || [ "$hostname" = "null" ]; then
              echo "❌ ERROR: Service ${namespace}/${service} has no NLB hostname — is it deployed?" >&2
              return 1
            fi
            echo "✓ Hostname: $hostname" >&2

            local nlb_arn
            nlb_arn=$(aws elbv2 describe-load-balancers \
              --query "LoadBalancers[?DNSName=='${hostname}'].LoadBalancerArn | [0]" \
              --output text)

            if [ -z "$nlb_arn" ] || [ "$nlb_arn" = "None" ]; then
              echo "❌ ERROR: No NLB found for hostname $hostname" >&2
              return 1
            fi
            echo "✓ NLB ARN: $nlb_arn" >&2

            local listener
            listener=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$nlb_arn" \
              --query "Listeners[?Port==\`80\`] | [0].ListenerArn" \
              --output text)

            if [ -z "$listener" ] || [ "$listener" = "None" ]; then
              echo "❌ ERROR: No port-80 listener on NLB $nlb_arn" >&2
              return 1
            fi
            echo "✓ ${desc} listener: $listener" >&2

            echo "$listener"
          }

          NLB_CADASTROS=$(get_nlb_listener \
            "mecanica-hermes-cadastros-${ENV}" \
            "mecanica-hermes-api-cadastros" \
            "api-cadastros")

          NLB_ORDEM_SERVICO=$(get_nlb_listener \
            "mecanica-hermes-ordem-servico-${ENV}" \
            "mecanica-hermes-api-ordem-servico" \
            "api-ordem-servico")

          NLB_PAGAMENTOS=$(get_nlb_listener \
            "mecanica-hermes-pagamentos-${ENV}" \
            "mecanica-hermes-api-pagamentos" \
            "api-pagamentos")

          # Fail fast if any listener was not found
          for VAR_NAME in NLB_CADASTROS NLB_ORDEM_SERVICO NLB_PAGAMENTOS; do
            VAL="${!VAR_NAME}"
            if [ -z "$VAL" ] || [ "$VAL" = "None" ]; then
              echo "❌ ERROR: Could not resolve $VAR_NAME — deploy all three K8s services first."
              exit 1
            fi
          done

          echo "Generating terraform.tfvars..."
          cat > terraform.tfvars <<EOF
          project_name          = "mechermes"
          environment           = "${ENV}"
          cognito_user_pool_arn = "${COGNITO_ARN}"
          cognito_app_client_id = "${COGNITO_CLIENT_ID}"
          lambda_function_arn   = "${LAMBDA_ARN}"
          lambda_function_name  = "mechermes-${ENV}-cognito-token-lambda"
          vpc_id                = "${VPC_ID}"
          private_subnets = ${PRIVATE_SUBNETS_JSON}
          nlb_cadastros_listener_arn     = "${NLB_CADASTROS}"
          nlb_ordem_servico_listener_arn = "${NLB_ORDEM_SERVICO}"
          nlb_pagamentos_listener_arn    = "${NLB_PAGAMENTOS}"
          EOF
          echo "✓ terraform.tfvars generated"
          cat terraform.tfvars
          terraform fmt -recursive

          aws lambda remove-permission \
            --function-name mechermes-${ENV}-cognito-token-lambda \
            --statement-id AllowExecutionFromAPIGateway-${ENV} || true

      - name: Terraform Init
        run: terraform init -backend-config=backend-${{ inputs.environment }}.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        id: output
        run: |
          API_GATEWAY_URL=$(terraform output -raw stage_invoke_url)
          echo "API_GATEWAY_URL=$API_GATEWAY_URL" >> $GITHUB_OUTPUT
          echo "✓ API Gateway URL: $API_GATEWAY_URL"

      - name: Summary
        run: |
          echo "## API Gateway - Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ API Gateway deployed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoint URL" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.output.outputs.API_GATEWAY_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Routes" >> $GITHUB_STEP_SUMMARY
          echo "| Route | Auth | Target |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| \`POST /auth/generate-token\` | None | Lambda (Cognito) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANY /api/clientes[/{proxy+}]\` | JWT | api-cadastros |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANY /api/produtos[/{proxy+}]\` | JWT | api-cadastros |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANY /api/notificacoes[/{proxy+}]\` | JWT | api-cadastros |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANY /api/servicos[/{proxy+}]\` | JWT | api-cadastros |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANY /api/webhooks/orcamentos[/{proxy+}]\` | None | api-cadastros |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANY /api/ordens-de-servico[/{proxy+}]\` | JWT | api-ordem-servico |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANY /api/pagamentos[/{proxy+}]\` | JWT | api-pagamentos |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANY /api/webhooks/mercadopago[/{proxy+}]\` | None | api-pagamentos |" >> $GITHUB_STEP_SUMMARY
