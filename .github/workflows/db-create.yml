name: Database - Terraform Create

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Target service"
        required: true
        default: "api-cadastros"
        type: choice
        options:
          - api-cadastros
          - api-ordem-servico
          - api-pagamentos
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prd

permissions:
  contents: read

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest
    environment: aws
    env:
      ENVIRONMENT: ${{ inputs.environment || vars.environment }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Create Bucket tfstate
        run: |
          if aws s3api head-bucket --bucket mechermes-tf-state-aws 2>/dev/null; then
            echo "Bucket already exists"
          else
            aws s3api create-bucket --bucket mechermes-tf-state-aws --region ${{ vars.AWS_DEFAULT_REGION }}
            echo "Bucket created, waiting 60 seconds before continuing..."
            sleep 60
          fi

      - name: Create DynamoDB Table for tf-locks
        run: |
          if aws dynamodb describe-table --table-name arn:aws:dynamodb:us-east-1:920117427782:table/mechermes-tf-locks 2>/dev/null; then
            echo "DynamoDB table already exists"
          else
            aws dynamodb create-table --table-name arn:aws:dynamodb:us-east-1:920117427782:table/mechermes-tf-locks --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 --region ${{ vars.AWS_DEFAULT_REGION }}
            echo "DynamoDB table created, waiting 20 seconds before continuing..."
            sleep 20
          fi

      - name: Terraform Init
        working-directory: ./services/${{ inputs.service }}
        run: terraform init "-backend-config=backend-${{ env.ENVIRONMENT }}.hcl"

      - name: Terraform Format
        working-directory: ./services/${{ inputs.service }}
        run: terraform fmt -check

      - name: Terraform Plan
        working-directory: ./services/${{ inputs.service }}
        run: terraform plan -input=false -var="environment=${{ env.ENVIRONMENT }}"

      - name: Terraform Apply
        working-directory: ./services/${{ inputs.service }}
        run: terraform apply -auto-approve -input=false -var="environment=${{ env.ENVIRONMENT }}"
